<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0616">
<title>天宫游戏厅</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0a0616;color:#f0ecff;min-height:100dvh;overflow-x:hidden;
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
}
body::before{
  content:'';position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 18% 18%,rgba(124,79,224,.42),transparent 42%),
    radial-gradient(circle at 82% 12%,rgba(52,168,224,.32),transparent 40%),
    radial-gradient(circle at 66% 86%,rgba(232,200,106,.26),transparent 44%),
    radial-gradient(circle at 8% 78%,rgba(226,84,164,.26),transparent 40%);
  filter:blur(22px);animation:flow 20s ease-in-out infinite alternate;
}
@keyframes flow{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(-3%,2%) scale(1.1)}
}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px}

header{padding:38px 4px 10px;text-align:center}
header h1{
  margin:0;font-size:29px;letter-spacing:5px;font-weight:900;
  background:linear-gradient(120deg,#f5e3a8,#e8c86a 40%,#ffd9a0 70%,#f5e3a8);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 16px rgba(232,200,106,.35));
}
header p{margin:10px 0 0;font-size:11.5px;color:#a89ecb;letter-spacing:3px}

.sec-title{
  display:flex;align-items:center;gap:9px;
  margin:30px 4px 14px;font-size:13px;font-weight:800;letter-spacing:1px;color:#e8c86a;
}
.sec-title .num{
  font-size:10px;font-weight:700;color:#8a7fb0;letter-spacing:1px;
  border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:2px 8px;
}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(232,200,106,.35),transparent)}

/* 游戏区空态 */
.empty{
  position:relative;border-radius:22px;padding:34px 20px;text-align:center;
  border:1.5px dashed rgba(232,200,106,.30);
  background:rgba(255,255,255,.03);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.empty .ei{font-size:38px;opacity:.55;line-height:1;margin-bottom:12px}
.empty b{display:block;font-size:14px;color:#c9c0e6;letter-spacing:1px;margin-bottom:8px}
.empty span{font-size:11.5px;color:#6f6493;line-height:1.9;display:block}

.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.slot{
  height:74px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  border:1.5px dashed rgba(255,255,255,.13);color:#4a4166;font-size:20px;
}

/* 作品链接 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:22px 12px;border-radius:20px;cursor:pointer;overflow:hidden;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
  text-decoration:none;color:inherit;
}
.card:active{transform:scale(.96)}
@media(hover:hover){.card:hover{transform:translateY(-3px);border-color:rgba(232,200,106,.5);background:rgba(255,255,255,.09)}}
.card::before{
  content:'';position:absolute;top:-40%;left:-30%;width:60%;height:180%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.14),transparent);
  transform:rotate(12deg);pointer-events:none;
}
.card i{font-size:28px;font-style:normal;line-height:1}
.card b{font-size:13px;font-weight:800;letter-spacing:.5px;text-align:center}
.card span{font-size:10px;color:#8a7fb0}
.card .go{
  position:absolute;right:12px;bottom:10px;font-size:11px;color:rgba(232,200,106,.55);
}

footer{margin-top:38px;text-align:center;font-size:10.5px;color:#5f5680;line-height:2}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>天宫游戏厅</h1>
    <p>游戏与作品 · 总站</p>
  </header>

  <div class="sec-title"><span>🎮 游戏</span><span class="num" id="gameCount">0 款</span></div>
  <div id="gameArea"></div>

  <div class="sec-title"><span>🏛 我的作品</span><span class="num" id="siteCount">4 个</span></div>
  <div class="grid" id="siteArea"></div>

  <footer>
    天宫游戏厅 · v1<br>
    游戏区还在搭建，作品先放在这里
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     作品清单：以前做过的网址，点了直接跳过去
     ============================================================ */
  var SITES = [
    { icon: '🏯', name: '天宫小队', desc: '任务 · 商店 · 法庭', url: 'https://cz12-name.github.io/tiangong/' },
    { icon: '🐌', name: '小蜗牛成长记录', desc: '喂食打卡 · 成长日历', url: 'https://jv8g8d.csb.app/' },
    { icon: '💻', name: '云电脑启动器', desc: '模拟电脑桌面', url: 'https://hwrxh7.csb.app/' },
    { icon: '🎁', name: '妹妹积分宝箱', desc: '任务 · 抽奖 · 兑换', url: 'https://wjcdd7.csb.app/' }
  ];

  /* ============================================================
     游戏清单：现在是空的。
     以后每做好一款游戏，就在这个数组里加一行，例如：
     { icon:'✊', name:'猜拳', desc:'石头剪刀布', url:'games/rps.html' }
     加完这里就会自动出现卡片。
     ============================================================ */
  var GAMES = [];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var gameArea = document.getElementById('gameArea');
  var siteArea = document.getElementById('siteArea');

  /* 游戏区 */
  if (!GAMES.length) {
    gameArea.innerHTML =
      '<div class="empty">' +
        '<div class="ei">🎮</div>' +
        '<b>游戏区还是空的</b>' +
        '<span>总站先搭好架子，游戏一款一款往里放。<br>第一款游戏做好后，会出现在这里。</span>' +
        '<div class="slots">' +
          '<div class="slot">＋</div><div class="slot">＋</div><div class="slot">＋</div>' +
        '</div>' +
      '</div>';
  } else {
    var g = '<div class="grid">';
    GAMES.forEach(function (x) {
      g += '<a class="card" href="' + esc(x.url || '#') + '">' +
        '<i>' + (x.icon || '🎮') + '</i>' +
        '<b>' + esc(x.name) + '</b>' +
        '<span>' + esc(x.desc || '') + '</span>' +
        '<em class="go">→</em></a>';
    });
    g += '</div>';
    gameArea.innerHTML = g;
  }
  document.getElementById('gameCount').textContent = GAMES.length + ' 款';

  /* 作品区 */
  var h = '';
  SITES.forEach(function (x) {
    h += '<a class="card" href="' + esc(x.url) + '" target="_blank" rel="noopener">' +
      '<i>' + x.icon + '</i>' +
      '<b>' + esc(x.name) + '</b>' +
      '<span>' + esc(x.desc) + '</span>' +
      '<em class="go">→</em></a>';
  });
  siteArea.innerHTML = h;
  document.getElementById('siteCount').textContent = SITES.length + ' 个';
})();
</script>
</body>
</html>
