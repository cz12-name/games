<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0616">
<title>天宫游戏厅</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0a0616;color:#f0ecff;min-height:100dvh;overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:'';position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 18% 18%,rgba(124,79,224,.42),transparent 42%),
    radial-gradient(circle at 82% 12%,rgba(52,168,224,.32),transparent 40%),
    radial-gradient(circle at 66% 86%,rgba(232,200,106,.26),transparent 44%),
    radial-gradient(circle at 8% 78%,rgba(226,84,164,.26),transparent 40%);
  filter:blur(22px);animation:flow 20s ease-in-out infinite alternate;
}
@keyframes flow{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(-3%,2%) scale(1.1)}
}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px 40px}

header{padding:34px 4px 20px;text-align:center}
header h1{
  margin:0;font-size:28px;letter-spacing:4px;font-weight:900;
  background:linear-gradient(120deg,#f5e3a8,#e8c86a 40%,#ffd9a0 70%,#f5e3a8);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(232,200,106,.35));
}
header p{margin:9px 0 0;font-size:12px;color:#a89ecb;letter-spacing:2px}

.sec-title{
  display:flex;align-items:center;gap:8px;
  margin:26px 4px 12px;font-size:13px;font-weight:800;letter-spacing:1px;color:#e8c86a;
}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(232,200,106,.35),transparent)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:22px 10px;border-radius:20px;cursor:pointer;overflow:hidden;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
  text-decoration:none;color:inherit;
}
.card:active{transform:scale(.96)}
@media(hover:hover){.card:hover{transform:translateY(-3px);border-color:rgba(232,200,106,.5);background:rgba(255,255,255,.09)}}
.card::before{
  content:'';position:absolute;top:-40%;left:-30%;width:60%;height:180%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.16),transparent);
  transform:rotate(12deg);pointer-events:none;
}
.card i{font-size:30px;font-style:normal;line-height:1}
.card b{font-size:14px;font-weight:800;letter-spacing:.5px}
.card span{font-size:10.5px;color:#9d92c4}
.card .best{position:absolute;top:8px;right:10px;font-size:9.5px;color:#e8c86a;opacity:.85}

.links .card{padding:16px 10px;flex-direction:row;gap:10px;justify-content:flex-start}
.links .card i{font-size:22px}
.links .card b{font-size:12.5px}

footer{margin-top:34px;text-align:center;font-size:10.5px;color:#5f5680;line-height:2}

/* ===== 游戏舞台 ===== */
.stage{
  position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
  background:rgba(8,4,18,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
}
.stage.on{display:flex;animation:stageIn .22s ease}
@keyframes stageIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.stage-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-shrink:0}
.stage-head b{font-size:16px;letter-spacing:2px;color:#f5e3a8;flex:1}
.stage-head button{
  width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);color:#f0ecff;font-size:16px;cursor:pointer;
}
.stage-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}

/* 通用按钮 */
.btn{
  border:none;border-radius:14px;padding:13px 20px;font-size:14px;font-weight:800;
  letter-spacing:1px;cursor:pointer;color:#1a1205;
  background:linear-gradient(135deg,#f5e3a8,#e8c86a);
  box-shadow:0 6px 20px rgba(232,200,106,.28);transition:transform .15s ease;
}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.08);color:#f5e3a8;border:1px solid rgba(232,200,106,.32);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.row3{display:flex;gap:10px;width:100%;max-width:340px}
.row3 button{
  flex:1;padding:16px 0;border-radius:16px;font-size:24px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#f0ecff;
  transition:transform .15s ease,background .15s ease;
}
.row3 button:active{transform:scale(.94);background:rgba(232,200,106,.18)}

/* 猜拳 */
.rps-out{
  width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:64px;background:radial-gradient(circle at 35% 30%,rgba(232,200,106,.22),rgba(255,255,255,.04));
  border:2px solid rgba(232,200,106,.35);box-shadow:0 0 40px rgba(232,200,106,.16);
}
.rps-out.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.rps-res{font-size:17px;font-weight:800;min-height:26px;letter-spacing:1px;text-align:center}
.rps-stats{font-size:12px;color:#9d92c4;letter-spacing:1px}

/* 游戏工具条 */
.hud{display:flex;align-items:center;justify-content:center;gap:16px;font-size:12.5px;color:#a89ecb;letter-spacing:.5px}
.hud b{color:#ffd36a;font-size:15px}
canvas{display:block;border-radius:16px;touch-action:none}

/* 方向键 */
.dpad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:14px}
.dpad button{
  border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);
  color:#f0ecff;font-size:19px;cursor:pointer;
}
.dpad button:active{background:rgba(232,200,106,.2)}
.dpad .up{grid-column:2}
.dpad .left{grid-column:1;grid-row:2}
.dpad .down{grid-column:2;grid-row:2}
.dpad .right{grid-column:3;grid-row:2}

.tip{font-size:11px;color:#6f6493;text-align:center;line-height:1.8;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>天宫游戏厅</h1>
    <p>做完了事 · 来玩两把</p>
  </header>

  <div class="sec-title">🎮 游戏</div>
  <div class="grid" id="gameGrid">
    <div class="card" data-game="rps">
      <i>✊</i><b>猜拳</b><span>石头剪刀布</span>
      <em class="best" id="best-rps"></em>
    </div>
    <div class="card" data-game="snake">
      <i>🐍</i><b>贪吃蛇</b><span>越吃越长</span>
      <em class="best" id="best-snake"></em>
    </div>
    <div class="card" data-game="g2048">
      <i>🔢</i><b>2048</b><span>合并数字</span>
      <em class="best" id="best-g2048"></em>
    </div>
    <div class="card" data-game="wheel">
      <i>🎰</i><b>幸运转盘</b><span>转到什么算什么</span>
      <em class="best" id="best-wheel"></em>
    </div>
  </div>

  <div class="sec-title">🏛 我的作品</div>
  <div class="grid links">
    <a class="card" href="https://cz12-name.github.io/tiangong/" target="_blank" rel="noopener">
      <i>🏯</i><b>天宫小队</b>
    </a>
    <a class="card" href="https://jv8g8d.csb.app/" target="_blank" rel="noopener">
      <i>🐌</i><b>小蜗牛成长记录</b>
    </a>
    <a class="card" href="https://hwrxh7.csb.app/" target="_blank" rel="noopener">
      <i>💻</i><b>云电脑启动器</b>
    </a>
    <a class="card" href="https://wjcdd7.csb.app/" target="_blank" rel="noopener">
      <i>🎁</i><b>妹妹积分宝箱</b>
    </a>
  </div>

  <footer>
    天宫游戏厅 · v1<br>
    最高分都存在这台设备上
  </footer>
</div>

<div class="stage" id="stage">
  <div class="stage-head">
    <b id="stTitle">游戏</b>
    <button id="stClose">✕</button>
  </div>
  <div class="stage-body" id="stBody"></div>
</div>

<script>
(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var stTitle = document.getElementById('stTitle');
  var stBody = document.getElementById('stBody');

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, html) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html !== undefined) d.innerHTML = html;
    return d;
  }
  function best(key) {
    var v = 0;
    try { v = parseInt(localStorage.getItem('tg_best_' + key) || '0', 10) || 0; } catch (e) {}
    return v;
  }
  function setBest(key, v) {
    if (v > best(key)) {
      try { localStorage.setItem('tg_best_' + key, String(v)); } catch (e) {}
      paintBest();
    }
  }
  function paintBest() {
    var r = best('rps');
    $('best-rps').textContent = r ? ('连胜 ' + r) : '';
    var s = best('snake');
    $('best-snake').textContent = s ? ('最高 ' + s) : '';
    var g = best('g2048');
    $('best-g2048').textContent = g ? ('最高 ' + g) : '';
    var w = best('wheel');
    $('best-wheel').textContent = w ? ('最高 ' + w) : '';
  }

  function openStage(title, build) {
    stTitle.textContent = title;
    stBody.innerHTML = '';
    stage.classList.add('on');
    build(stBody);
  }
  function closeStage() {
    stage.classList.remove('on');
    stBody.innerHTML = '';
    if (window.__cleanup) { try { window.__cleanup(); } catch (e) {} window.__cleanup = null; }
  }
  $('stClose').onclick = closeStage;
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && stage.classList.contains('on')) closeStage();
  });

  document.getElementById('gameGrid').addEventListener('click', function (e) {
    var c = e.target.closest('[data-game]');
    if (!c) return;
    var g = c.getAttribute('data-game');
    if (g === 'rps') openRPS();
    else if (g === 'snake') openSnake();
    else if (g === 'g2048') open2048();
    else if (g === 'wheel') openWheel();
  });

  /* ============ 1. 猜拳 ============ */
  var RPS_ICON = ['✊', '✋', '✌️'];
  function openRPS() {
    openStage('✊ 猜拳', function (body) {
      var out = el('div', 'rps-out', '✊');
      var res = el('div', 'rps-res', '选一个开始');
      var stats = el('div', 'rps-stats', '胜 0 · 平 0 · 负 0');
      var row = el('div', 'row3');
      ['✊', '✋', '✌️'].forEach(function (ic, i) {
        var b = el('button', '', ic);
        b.onclick = function () { play(i); };
        row.appendChild(b);
      });
      var wrap = el('div', 'center');
      wrap.appendChild(out); wrap.appendChild(res); wrap.appendChild(stats); wrap.appendChild(row);
      wrap.appendChild(el('div', 'tip', '赢了会记连胜，最高连胜存在本机'));
      body.appendChild(wrap);

      var win = 0, tie = 0, lose = 0, streak = 0;
      function play(p) {
        var cpu = Math.floor(Math.random() * 3);
        out.textContent = RPS_ICON[cpu];
        out.classList.remove('pop');
        void out.offsetWidth;
        out.classList.add('pop');
        if (p === cpu) {
          tie++; streak = 0;
          res.textContent = '平局';
          res.style.color = '#c9c0e6';
        } else if ((p === 0 && cpu === 2) || (p === 1 && cpu === 0) || (p === 2 && cpu === 1)) {
          win++; streak++;
          res.textContent = '你赢了 🎉';
          res.style.color = '#9bf0b4';
          setBest('rps', streak);
        } else {
          lose++; streak = 0;
          res.textContent = '你输了';
          res.style.color = '#ff9d9d';
        }
        stats.textContent = '胜 ' + win + ' · 平 ' + tie + ' · 负 ' + lose +
          (streak > 1 ? '　🔥 连' + streak : '');
      }
    });
  }

  /* ============ 2. 贪吃蛇 ============ */
  function openSnake() {
    openStage('🐍 贪吃蛇', function (body) {
      var wrap = el('div', 'center');
      var hud = el('div', 'hud', '得分 <b id="snScore">0</b>　最高 <span id="snBest">' + best('snake') + '</span>');
      var cv = el('canvas');
      var N = 15, PX = 300;
      cv.width = PX; cv.height = PX;
      cv.style.width = 'min(84vw,300px)';
      cv.style.height = 'min(84vw,300px)';
      var dpad = el('div', 'dpad');
      [['up', '↑'], ['left', '←'], ['down', '↓'], ['right', '→']].forEach(function (p) {
        var b = el('button', p[0], p[1]);
        b.onclick = function () { dir(p[0]); };
        dpad.appendChild(b);
      });
      wrap.appendChild(hud); wrap.appendChild(cv); wrap.appendChild(dpad);
      wrap.appendChild(el('div', 'tip', '点方向键或按键盘方向键控制'));
      body.appendChild(wrap);

      var ctx = cv.getContext('2d');
      var cell = PX / N;
      var snake, dirv, food, score, alive, timer;
      var started = false;

      function reset() {
        snake = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }];
        dirv = { x: 1, y: 0 };
        score = 0;
        alive = true;
        food = randFood();
        $('snScore').textContent = '0';
        draw();
      }
      function randFood() {
        for (var k = 0; k < 500; k++) {
          var f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
          var hit = false;
          for (var i = 0; i < snake.length; i++) if (snake[i].x === f.x && snake[i].y === f.y) hit = true;
          if (!hit) return f;
        }
        return { x: 0, y: 0 };
      }
      function draw() {
        ctx.fillStyle = '#0d0a1e'; ctx.fillRect(0, 0, PX, PX);
        ctx.fillStyle = '#ffd36a';
        ctx.beginPath();
        ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.32, 0, Math.PI * 2);
        ctx.fill();
        for (var i = 0; i < snake.length; i++) {
          ctx.fillStyle = i === 0 ? '#9bf0b4' : '#6fc3ff';
          var r = i === 0 ? 6 : 4;
          roundRect(snake[i].x * cell + 1, snake[i].y * cell + 1, cell - 2, cell - 2, r);
          ctx.fill();
        }
      }
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function step() {
        var h = { x: snake[0].x + dirv.x, y: snake[0].y + dirv.y };
        if (h.x < 0 || h.x >= N || h.y < 0 || h.y >= N) return over();
        for (var i = 0; i < snake.length; i++) if (snake[i].x === h.x && snake[i].y === h.y) return over();
        snake.unshift(h);
        if (h.x === food.x && h.y === food.y) {
          score++;
          $('snScore').textContent = String(score);
          food = randFood();
          if (score % 5 === 0) { clearInterval(timer); timer = setInterval(step, Math.max(70, 150 - score * 4)); }
        } else snake.pop();
        draw();
      }
      function over() {
        alive = false;
        clearInterval(timer);
        setBest('snake', score);
        $('snBest').textContent = String(Math.max(score, best('snake')));
        var w = el('div', 'center');
        w.innerHTML = '<div style="font-size:20px;font-weight:800;color:#ffd36a">得分 ' + score + '</div>' +
          '<div style="font-size:12px;color:#a89ecb">最高 ' + best('snake') + '</div>';
        body.appendChild(w);
        setTimeout(function () {
          if (!stage.classList.contains('on')) return;
          var again = el('button', 'btn', '再 来 一 局');
          again.style.marginTop = '6px';
          again.onclick = function () { w.remove(); again.remove(); start(); };
          body.appendChild(again);
        }, 10);
      }
      function start() {
        reset();
        started = true;
        clearInterval(timer);
        timer = setInterval(step, 150);
      }
      function dir(d) {
        if (!started || !alive) return;
        if (d === 'up' && dirv.y === 0) dirv = { x: 0, y: -1 };
        else if (d === 'down' && dirv.y === 0) dirv = { x: 0, y: 1 };
        else if (d === 'left' && dirv.x === 0) dirv = { x: -1, y: 0 };
        else if (d === 'right' && dirv.x === 0) dirv = { x: 1, y: 0 };
      }
      var keyH = function (e) {
        if (e.key === 'ArrowUp') { dir('up'); e.preventDefault(); }
        else if (e.key === 'ArrowDown') { dir('down'); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { dir('left'); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { dir('right'); e.preventDefault(); }
      };
      document.addEventListener('keydown', keyH);
      window.__cleanup = function () { clearInterval(timer); document.removeEventListener('keydown', keyH); };

      reset();
      var go = el('button', 'btn', '开 始');
      go.style.marginTop = '10px';
      go.onclick = function () { go.remove(); start(); };
      wrap.insertBefore(go, wrap.querySelector('.tip'));
    });
  }

  /* ============ 3. 2048 ============ */
  function open2048() {
    openStage('🔢 2048', function (body) {
      var wrap = el('div', 'center');
      var hud = el('div', 'hud', '得分 <b id="g2Score">0</b>　最高 <span id="g2Best">' + best('g2048') + '</span>');
      var cv = el('canvas');
      var PX = 320;
      cv.width = PX; cv.height = PX;
      cv.style.width = 'min(88vw,320px)';
      cv.style.height = 'min(88vw,320px)';
      var dpad = el('div', 'dpad');
      [['up', '↑'], ['left', '←'], ['down', '↓'], ['right', '→']].forEach(function (p) {
        var b = el('button', p[0], p[1]);
        b.onclick = function () { move(p[0]); };
        dpad.appendChild(b);
      });
      wrap.appendChild(hud); wrap.appendChild(cv); wrap.appendChild(dpad);
      wrap.appendChild(el('div', 'tip', '相同数字碰在一起就合并，凑到 2048'));
      body.appendChild(wrap);

      var ctx = cv.getContext('2d');
      var N = 4, PAD = 10, GAP = 10;
      var cell = (PX - PAD * 2 - GAP * (N - 1)) / N;
      var grid, score, over, started;
      var COLORS = {
        2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f',
        64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850',
        1024: '#edc53f', 2048: '#edc22e'
      };
      function xy(r, c) { return [PAD + c * (cell + GAP), PAD + r * (cell + GAP)]; }
      function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function newGrid() {
        grid = [];
        for (var r = 0; r < N; r++) grid.push([0, 0, 0, 0]);
        score = 0; over = false;
        addRand(); addRand();
        $('g2Score').textContent = '0';
        draw();
      }
      function addRand() {
        var empty = [];
        for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
        if (!empty.length) return;
        var p = empty[Math.floor(Math.random() * empty.length)];
        grid[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
      }
      function draw() {
        ctx.fillStyle = '#0d0a1e'; ctx.fillRect(0, 0, PX, PX);
        for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
          var pos = xy(r, c), x = pos[0], y = pos[1];
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          rr(x, y, cell, cell, 10); ctx.fill();
          var v = grid[r][c];
          if (v) {
            ctx.fillStyle = COLORS[v] || '#3c3a32';
            rr(x, y, cell, cell, 10); ctx.fill();
            ctx.fillStyle = v <= 4 ? '#6b5a3e' : '#ffffff';
            var fs = v < 100 ? 30 : (v < 1000 ? 24 : 18);
            ctx.font = 'bold ' + fs + 'px -apple-system,sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(String(v), x + cell / 2, y + cell / 2 + 1);
          }
        }
      }
      function slide(line) {
        var a = line.filter(function (v) { return v; });
        var out = [], gained = 0;
        for (var i = 0; i < a.length; i++) {
          if (i + 1 < a.length && a[i] === a[i + 1]) { out.push(a[i] * 2); gained += a[i] * 2; i++; }
          else out.push(a[i]);
        }
        while (out.length < N) out.push(0);
        return { line: out, gained: gained };
      }
      function move(d) {
        if (!started || over) return;
        var moved = false, gained = 0, i, r, res, line;
        for (i = 0; i < N; i++) {
          if (d === 'left' || d === 'right') {
            line = grid[i].slice();
            if (d === 'right') line.reverse();
            res = slide(line);
            if (d === 'right') res.line.reverse();
            if (res.line.join() !== grid[i].join()) moved = true;
            grid[i] = res.line; gained += res.gained;
          } else {
            line = [];
            for (r = 0; r < N; r++) line.push(grid[r][i]);
            if (d === 'down') line.reverse();
            res = slide(line);
            if (d === 'down') res.line.reverse();
            for (r = 0; r < N; r++) {
              if (grid[r][i] !== res.line[r]) moved = true;
              grid[r][i] = res.line[r];
            }
            gained += res.gained;
          }
        }
        if (moved) {
          score += gained;
          $('g2Score').textContent = String(score);
          addRand(); draw();
          if (!canMove()) end();
        }
      }
      function canMove() {
        for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
          if (!grid[r][c]) return true;
          if (c + 1 < N && grid[r][c] === grid[r][c + 1]) return true;
          if (r + 1 < N && grid[r][c] === grid[r + 1][c]) return true;
        }
        return false;
      }
      function end() {
        over = true;
        setBest('g2048', score);
        $('g2Best').textContent = String(Math.max(score, best('g2048')));
        var box = el('div', 'center');
        box.innerHTML = '<div style="font-size:20px;font-weight:800;color:#ffd36a">没路走了</div>' +
          '<div style="font-size:13px;color:#a89ecb">得分 ' + score + ' · 最高 ' + best('g2048') + '</div>';
        body.appendChild(box);
        setTimeout(function () {
          if (!stage.classList.contains('on')) return;
          var again = el('button', 'btn', '再 来 一 局');
          again.onclick = function () { box.remove(); again.remove(); start(); };
          body.appendChild(again);
        }, 10);
      }
      function start() {
        newGrid();
        started = true;
        over = false;
      }
      var keyH = function (e) {
        if (!started) return;
        if (e.key === 'ArrowUp') { move('up'); e.preventDefault(); }
        else if (e.key === 'ArrowDown') { move('down'); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { move('left'); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { move('right'); e.preventDefault(); }
      };
      document.addEventListener('keydown', keyH);
      window.__cleanup = function () { document.removeEventListener('keydown', keyH); };

      newGrid();
      var go = el('button', 'btn', '开 始');
      go.onclick = function () { go.remove(); start(); };
      wrap.insertBefore(go, wrap.querySelector('.tip'));
      started = false;
    });
  }

  /* ============ 4. 幸运转盘 ============ */
  function openWheel() {
    openStage('🎰 幸运转盘', function (body) {
      var wrap = el('div', 'center');
      var cv = el('canvas');
      var PX = 300;
      cv.width = PX; cv.height = PX;
      cv.style.width = 'min(80vw,300px)';
      cv.style.height = 'min(80vw,300px)';
      var res = el('div', 'rps-res', '点下面开始转');
      var btn = el('button', 'btn', '转 一 下');
      wrap.appendChild(cv); wrap.appendChild(res); wrap.appendChild(btn);
      wrap.appendChild(el('div', 'tip', '转到「再来一次」可以免费再转一次'));
      body.appendChild(wrap);

      var ctx = cv.getContext('2d');
      var SEG = [
        { t: '谢谢参与', c: '#3a2d6b', w: 40 },
        { t: '再来一次', c: '#5b3fa8', w: 30 },
        { t: '小奖 +1', c: '#c98a2e', w: 20 },
        { t: '大奖 +3', c: '#e8c86a', w: 10 }
      ];
      var angle = 0, spinning = false;
      var total = 0, free = 0;

      function draw(a) {
        ctx.clearRect(0, 0, PX, PX);
        var cx = PX / 2, cy = PX / 2, R = PX * 0.44;
        var per = Math.PI * 2 / SEG.length;
        for (var i = 0; i < SEG.length; i++) {
          var s = a + i * per, e = s + per;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, R, s, e);
          ctx.closePath();
          ctx.fillStyle = SEG[i].c;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,.14)';
          ctx.lineWidth = 2;
          ctx.stroke();
          var mid = s + per / 2;
          ctx.save();
          ctx.translate(cx + Math.cos(mid) * R * 0.62, cy + Math.sin(mid) * R * 0.62);
          ctx.rotate(mid);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 14px -apple-system,sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(SEG[i].t, 0, 0);
          ctx.restore();
        }
        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.16, 0, Math.PI * 2);
        ctx.fillStyle = '#0d0a1e';
        ctx.fill();
        ctx.strokeStyle = 'rgba(232,200,106,.6)';
        ctx.lineWidth = 3;
        ctx.stroke();
        // 指针
        ctx.beginPath();
        ctx.moveTo(cx, cy - R - 6);
        ctx.lineTo(cx - 11, cy - R + 16);
        ctx.lineTo(cx + 11, cy - R + 16);
        ctx.closePath();
        ctx.fillStyle = '#f5e3a8';
        ctx.fill();
      }

      function pick() {
        var r = Math.random() * 100;
        if (r < SEG[0].w) return 0;
        if (r < SEG[0].w + SEG[1].w) return 1;
        if (r < SEG[0].w + SEG[1].w + SEG[2].w) return 2;
        return 3;
      }

      function spin() {
        if (spinning) return;
        if (free <= 0) { /* 无限制，纯娱乐 */ }
        spinning = true;
        btn.disabled = true;
        res.textContent = '转…';
        var idx = pick();
        var per = Math.PI * 2 / SEG.length;
        var start = angle;
        var targetBase = -idx * per - per / 2 - Math.PI / 2;
        var turns = Math.PI * 2 * (4 + Math.floor(Math.random() * 3));
        var delta = turns + ((targetBase - start) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        var dur = 3200, t0 = performance.now();
        function frame(now) {
          var p = Math.min(1, (now - t0) / dur);
          var e = 1 - Math.pow(1 - p, 3);
          angle = start + delta * e;
          draw(angle);
          if (p < 1) requestAnimationFrame(frame);
          else {
            angle = targetBase;
            draw(angle);
            spinning = false;
            btn.disabled = false;
            btn.textContent = '再 转 一 次';
            if (idx === 1) { free++; res.textContent = '再来一次！免费再转'; }
            else if (idx === 2) { total += 1; setBest('wheel', total); res.textContent = '小奖 +1　累计 ' + total; }
            else if (idx === 3) { total += 3; setBest('wheel', total); res.textContent = '大奖 +3　累计 ' + total; }
            else { res.textContent = '谢谢参与，再试试'; }
            res.style.color = idx === 0 ? '#8a7fb0' : '#9bf0b4';
          }
        }
        requestAnimationFrame(frame);
      }
      btn.onclick = spin;
      draw(0);
    });
  }

  paintBest();
})();
</script>
</body>
